name: publish
run-name: "subtext CLI build"

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  OPENCODE_VERSION: "1.18.16"
  OPENCODE_CHANNEL: "latest"
  OPENCODE_TARGETS: "darwin-x64,darwin-x64-baseline,darwin-arm64"

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Build
        id: build
        run: |
          ./packages/opencode/script/build.ts
          ./packages/cli/script/build.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: subtext-cli
          path: packages/opencode/dist/opencode-darwin*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: subtext-preview-cli
          path: packages/cli/dist/cli-*
